<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Actions Labs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep:   #0d1117;
      --bg-panel:  #161b22;
      --bg-header: #0a0e14;
      --accent:    #2ea44f;
      --accent2:   #58a6ff;
      --border:    #21262d;
      --text:      #c9d1d9;
      --text-dim:  #484f58;
      --handle-w:  6px;
      --header-h:  48px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* ── Header ──────────────────────────────────────────── */
    #header {
      height: var(--header-h);
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
      flex-shrink: 0;
      z-index: 10;
    }
    #header h1 { font-size: 1.1rem; color: var(--accent); white-space: nowrap; letter-spacing: .03em; }
    .spacer { flex: 1; }

    /* ── Status dot ──────────────────────────────────────── */
    #status { display: flex; align-items: center; gap: 7px; font-size: .8rem; color: var(--text-dim); white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text-dim); transition: background .3s; flex-shrink: 0; }
    .dot.connected    { background: #4caf50; }
    .dot.disconnected { background: #f85149; }

    /* ── Main split ──────────────────────────────────────── */
    #main {
      display: flex;
      height: calc(100vh - var(--header-h));
      overflow: hidden;
    }

    /* ── Docs pane (left) ────────────────────────────────── */
    #docs-pane {
      width: 50%;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
    }
    #docs-pane-bar {
      height: 32px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      font-size: .75rem;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    #docs-pane-bar svg { width: 14px; height: 14px; fill: var(--accent); flex-shrink: 0; }
    #docs-frame { flex: 1; border: none; width: 100%; background: #fff; }

    /* ── Drag handle ─────────────────────────────────────── */
    #drag-handle {
      width: var(--handle-w);
      background: var(--border);
      cursor: col-resize;
      flex-shrink: 0;
      position: relative;
      transition: background .15s;
      z-index: 5;
    }
    #drag-handle:hover, #drag-handle.dragging { background: var(--accent); }
    #drag-handle::after { content: ''; position: absolute; inset: 0 -4px; }

    /* ── Terminal pane (right) ───────────────────────────── */
    #terminal-pane {
      flex: 1;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #term-bar {
      height: 32px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      font-size: .75rem;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    #term-bar svg { width: 14px; height: 14px; fill: var(--accent2); flex-shrink: 0; }
    #term-container {
      flex: 1;
      padding: 6px 8px;
      overflow: hidden;
      background: var(--bg-deep);
    }
    #term-container .xterm { height: 100%; }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="header">
    <!-- GitHub Actions workflow icon -->
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="flex-shrink:0">
      <circle cx="5" cy="12" r="2" fill="#2ea44f"/>
      <circle cx="12" cy="6" r="2" fill="#2ea44f"/>
      <circle cx="12" cy="18" r="2" fill="#2ea44f"/>
      <circle cx="19" cy="12" r="2" fill="#2ea44f"/>
      <line x1="7" y1="12" x2="17" y2="12" stroke="#2ea44f" stroke-width="1.5"/>
      <line x1="12" y1="8" x2="12" y2="10" stroke="#2ea44f" stroke-width="1.5"/>
      <line x1="12" y1="14" x2="12" y2="16" stroke="#2ea44f" stroke-width="1.5"/>
    </svg>
    <h1>GitHub Actions Labs</h1>
    <div class="spacer"></div>
    <div id="status">
      <div class="dot" id="global-dot"></div>
      <span id="global-status-text">Connecting…</span>
    </div>
  </div>

  <!-- Main split -->
  <div id="main">

    <!-- Left: Docs -->
    <div id="docs-pane">
      <div id="docs-pane-bar">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/></svg>
        <span>Documentation</span>
      </div>
      <iframe id="docs-frame" src="about:blank"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
        title="GitHub Actions Labs Documentation"></iframe>
    </div>

    <!-- Drag handle -->
    <div id="drag-handle"></div>

    <!-- Right: Terminal -->
    <div id="terminal-pane">
      <div id="term-bar">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4V6zm0-2a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H4zm3 5l2 2-2 2m4 0h4"/></svg>
        <span>Terminal</span>
      </div>
      <div id="term-container"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
  <script>
  (function () {

    /* ── Docs frame ──────────────────────────────────────── */
    const docsFrame = document.getElementById('docs-frame');
    fetch('/docs/', { method: 'HEAD' })
      .then(r => { docsFrame.src = r.ok ? '/docs/' : 'https://nirgeier.github.io/GithubActionsLabs/'; })
      .catch(() => { docsFrame.src = 'https://nirgeier.github.io/GithubActionsLabs/'; });

    /* ── Resizable split ─────────────────────────────────── */
    const mainEl   = document.getElementById('main');
    const docsPane = document.getElementById('docs-pane');
    const handle   = document.getElementById('drag-handle');
    let dragging = false, startX, startW;

    handle.addEventListener('mousedown', e => {
      dragging = true; startX = e.clientX;
      startW = docsPane.getBoundingClientRect().width;
      handle.classList.add('dragging');
      document.body.style.cssText += ';cursor:col-resize;user-select:none';
      docsFrame.style.pointerEvents = 'none';
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      const totalW = mainEl.getBoundingClientRect().width;
      docsPane.style.width = Math.max(200, Math.min(startW + (e.clientX - startX), totalW - 300)) + 'px';
      try { fitAddon.fit(); } catch (_) {}
    });
    document.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      docsFrame.style.pointerEvents = '';
      try { fitAddon.fit(); } catch (_) {}
    });

    /* ── xterm.js theme ─────────────────────────────────── */
    const THEME = {
      background:          '#0d1117',
      foreground:          '#c9d1d9',
      cursor:              '#2ea44f',
      selectionBackground: '#21262d',
      black:  '#0d1117', red:     '#f85149', green:   '#2ea44f', yellow: '#e3b341',
      blue:   '#58a6ff', magenta: '#bc8cff', cyan:    '#39c5cf', white:  '#c9d1d9',
      brightBlack: '#4a5068', brightRed:    '#ff7b72', brightGreen: '#56d364',
      brightYellow:'#e3b341', brightBlue:   '#79c0ff', brightMagenta:'#d2a8ff',
      brightCyan:  '#56d9ff', brightWhite:  '#f0f6fc',
    };

    /* ── Terminal ────────────────────────────────────────── */
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: '"Cascadia Code","Fira Code","JetBrains Mono",Menlo,Monaco,monospace',
      theme: THEME,
      allowProposedApi: true,
      scrollback: 5000,
    });
    const fitAddon = new FitAddon.FitAddon();
    const wlAddon  = new WebLinksAddon.WebLinksAddon();
    term.loadAddon(fitAddon);
    term.loadAddon(wlAddon);
    term.open(document.getElementById('term-container'));
    setTimeout(() => fitAddon.fit(), 50);
    window.addEventListener('resize', () => { try { fitAddon.fit(); } catch (_) {} });

    /* ── WebSocket ───────────────────────────────────────── */
    const gdot = document.getElementById('global-dot');
    const gtxt = document.getElementById('global-status-text');

    function setStatus(state) {
      gdot.className = 'dot ' + state;
      gtxt.textContent = state === 'connected' ? 'Connected' : 'Disconnected';
    }

    function connect() {
      setStatus('disconnected');
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}`);

      ws.onopen = () => {
        setStatus('connected');
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'output') term.write(msg.data);
          if (msg.type === 'exit') {
            term.writeln('\r\n\x1b[31m[Session ended]\x1b[0m');
            setStatus('disconnected');
          }
        } catch (_) {}
      };

      ws.onclose = () => {
        setStatus('disconnected');
        term.writeln('\r\n\x1b[33m[Reconnecting in 3 s…]\x1b[0m');
        setTimeout(connect, 3000);
      };
      ws.onerror = () => setStatus('disconnected');

      term.onData(data => {
        if (ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify({ type: 'input', data }));
      });
      term.onResize(size => {
        if (ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify({ type: 'resize', cols: size.cols, rows: size.rows }));
      });
    }

    connect();

  })();
  </script>
</body>
</html>
